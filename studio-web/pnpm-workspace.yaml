# SPDX-License-Identifier: AGPL-3.0-or-later

# Force patched transitive dependencies across the Studio tooling tree. pnpm 11
# reads overrides here, not in package.json.
overrides:
  # GHSA-73wf-gq98-2v4g: reject inherited-key crashes and prototype writes
  # from attacker-controlled browserslist statistics.
  browserslist: '>=4.28.7'
  # Security floor for the current request-smuggling, cache and CRLF advisories.
  undici: '>=7.30.1'
  # jsdom requires undici 7.x internals directly
  # (lib/handler/wrap-handler.js, removed in undici 8); keep its subtree on
  # the secured 7.x line instead of letting the blanket override force 8.x.
  jsdom>undici: '>=7.30.1 <8.0.0'
  # GHSA-vwc7-r8mq-g2x9 and GHSA-xcpc-8h2w-3j85: block writes through
  # destination symlinks and reject oversized declared ZIP entries.
  adm-zip: 0.6.1
  # GHSA-rgw5-rvv9-x895: bound brace expansion memory use.
  brace-expansion: 5.0.12
  # GHSA-fxqj-rqcc-2cmp: prevent sourceMappingURL file disclosure.
  postcss: 8.5.23
  # GHSA-2v37-7h3g-55p8: prevent zero-size custom-generator loops.
  nanoid: 3.3.18
