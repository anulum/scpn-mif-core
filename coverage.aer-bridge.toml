# SCPN-MIF-CORE — required coverage for the source-bound AER bridge.

[run]
source = ["src/scpn_mif_core/aer"]
branch = true

[report]
include = ["*/aer/exact_current_lif_bridge.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
show_missing = true
skip_covered = false
fail_under = 100
