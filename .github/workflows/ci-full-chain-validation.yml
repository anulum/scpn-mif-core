# SCPN-MIF-CORE — Cross-repository full-chain validation workflow
name: CI / Full-chain validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  full-chain:
    name: Fusion-to-Fire (siblings + Rust + Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ecosystem/SCPN-MIF-CORE
    steps:
      - name: Checkout MIF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ecosystem/SCPN-MIF-CORE
      - name: Checkout CONTROL integration anchor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anulum/scpn-control
          ref: 856adaf10f247bc77943f0c034fdc3a0e997eaa6
          path: ecosystem/SCPN-CONTROL
      - name: Checkout Fusion integration anchor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anulum/scpn-fusion-core
          ref: c22ebd7a4c487abcc98e4767a984404163a5e474
          path: ecosystem/SCPN-FUSION-CORE
      - name: Checkout SC-NeuroCore integration anchor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anulum/sc-neurocore
          ref: e633d1c15f8429d0538b7ab778dc7f83194d3f1d
          path: ecosystem/SC-NEUROCORE
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecosystem/SCPN-MIF-CORE/requirements/full-chain-ci.txt
      - name: Install hash-locked cross-repository runtime
        run: |
          python -m pip install --require-hashes -r requirements/full-chain-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install --no-deps --no-build-isolation -e ../SCPN-CONTROL
          python -m pip install --no-deps --no-build-isolation -e ../SCPN-FUSION-CORE
          python -m pip install --no-deps --no-build-isolation -e ../SC-NEUROCORE
          python -m pip check
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator
      - name: Run the real causal chain
        run: >
          pytest tests/unit/full_chain/test_contracts.py
          tests/integration/test_full_chain_demo.py
          -o "addopts=-ra --strict-markers --strict-config -p no:nengo -p no:randomly"
          --cov=src/scpn_mif_core/full_chain
          --cov-config=coverage.full-chain.toml
          --cov-report=term-missing
          --cov-fail-under=95
