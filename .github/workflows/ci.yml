# SCPN-MIF-CORE — CI coordinator and stable required gate
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    uses: ./.github/workflows/ci-python-quality.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  full-chain-validation:
    uses: ./.github/workflows/ci-full-chain-validation.yml
  rust-quality:
    uses: ./.github/workflows/ci-rust-quality.yml
  repository-governance:
    uses: ./.github/workflows/ci-repository-governance.yml
  secret-assurance:
    uses: ./.github/workflows/ci-secret-assurance.yml
  studio-product:
    uses: ./.github/workflows/ci-studio-product.yml

  required-core:
    name: Required core gate
    needs: [python-quality, full-chain-validation, rust-quality, repository-governance, secret-assurance, studio-product]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - name: Require every core category
        env:
          CATEGORY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CATEGORY_RESULTS"])
          failures = {
              name: value["result"]
              for name, value in results.items()
              if value["result"] != "success"
          }
          if failures:
              raise SystemExit(f"Required core category failure: {failures}")
          print("Required core categories passed")
          PY
