# SCPN-MIF-CORE — Studio product validation workflow
name: CI / Studio product

on:
  workflow_call:

permissions:
  contents: read

jobs:
  studio-web:
    name: Studio web (Module Federation remote)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.2.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build strict TypeDoc API reference
        run: pnpm docs:api
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Tests + 100% coverage gate
        run: pnpm exec vitest run --coverage
      - name: Build (Module Federation remote)
        run: pnpm build
