# SPDX-License-Identifier: AGPL-3.0-or-later
name: Paper review draft

on:
  push:
    branches: [main]
    paths:
      - "papers/submissions/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "papers/submissions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    name: Build review PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify committed package
        run: python papers/submissions/001_formally_verified_deterministic_trigger_interlock/verify_package.py
      - name: Build JOSS-format review PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # master 2024-07-17
        with:
          journal: joss
          paper-path: papers/submissions/001_formally_verified_deterministic_trigger_interlock/manuscript.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: manuscript-review
          path: papers/submissions/001_formally_verified_deterministic_trigger_interlock/manuscript.pdf
