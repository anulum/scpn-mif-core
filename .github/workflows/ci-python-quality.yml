# SCPN-MIF-CORE — Python quality and co-simulation workflow
name: CI / Python quality

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + type + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ensure Rust 1.85
        shell: bash
        run: |
          if ! rustc +1.85.0 --version; then
            rustup toolchain uninstall 1.85.0 || true
            rustup toolchain install 1.85.0 --profile minimal --no-self-update
          fi
          rustc +1.85.0 --version
          cargo +1.85.0 --version
      - name: Build Rust extension
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: python -m pip install --no-deps --no-build-isolation ./scpn-mif-rs/crates/mif-ffi
      - name: ruff check
        run: ruff check src/ tests/ bench/ tools/
      - name: ruff format
        run: ruff format --check src/ tests/ bench/ tools/
      - name: mypy
        run: mypy src/scpn_mif_core/ tools/ cosim/ examples/
      - name: bandit
        run: bandit -r src/scpn_mif_core/ -c pyproject.toml -q
      - name: pytest (full tree under the 100% coverage gate)
        run: pytest tests/ -m "not full_chain" --cov=scpn_mif_core --cov=tools --cov-report=xml --cov-report=term
      - name: Install Verilator for cosimulation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator
      - name: cosim (bit-true Python vs Verilator, 100% harness coverage gate)
        run: >
          pytest cosim/ -o addopts=""
          --cov=cosim --cov-report=term-missing --cov-fail-under=100
          -p no:nengo -p no:randomly
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
