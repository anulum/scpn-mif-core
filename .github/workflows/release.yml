# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  source-gates:
    name: Require green source gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require successful core and formal checks on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for required in "Required core gate" "Required formal gate"; do
            conclusion=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq ".check_runs | map(select(.name == \"$required\")) | sort_by(.completed_at) | last | .conclusion")
            if [ "$conclusion" != success ]; then
              echo "required source check '$required' is '$conclusion', not success"
              exit 1
            fi
          done

  claim-ledger-review:
    name: Verify private claim-ledger review receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a fresh review of the immediately preceding source commit
        run: |
          python tools/claim_ledger_review.py check \
            docs/_generated/claim_ledger_review.json \
            --expected-reviewed-commit "$(git rev-parse HEAD^)" \
            --max-age-days 30

  build:
    name: Build sdist + wheel
    needs: [source-gates, claim-ledger-review]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
      - name: Verify version pin
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          VERSION_PY=$(python -c "import scpn_mif_core; print(scpn_mif_core.__version__)")
          if [ "$VERSION_TAG" != "$VERSION_PY" ]; then
            echo "tag $VERSION_TAG does not match package $VERSION_PY"
            exit 1
          fi
      - run: python -m build
      - name: Verify wheel package contents
        run: python tools/check_wheel_contents.py dist
      - name: Attest build provenance (sigstore)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/scpn-mif-core
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
        with:
          attestations: true

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          generate_release_notes: true
          files: dist/*
