# SPDX-License-Identifier: AGPL-3.0-or-later
name: Formal verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbiyosys:
    name: SymbiYosys (Yosys + z3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install OSS CAD Suite (Yosys + SymbiYosys + z3)
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df  # v4
      - name: Check formal proof-status manifest is current
        run: python3 tools/formal_manifest.py --check
      - name: Run MIF-010 property suites
        run: python3 tools/run_formal.py --suite all

  lean:
    name: Lean 4 + mathlib4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIF_LEAN_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9  # v1
        with:
          auto-config: false
          build: true
          build-args: "+SCPNMIF:olean"
          use-mathlib-cache: true

  required-formal:
    name: Required formal gate
    if: always()
    needs: [symbiyosys, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require HDL and Lean proof jobs
        env:
          SYMBIYOSYS_RESULT: ${{ needs.symbiyosys.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
        run: |
          test "$SYMBIYOSYS_RESULT" = success
          test "$LEAN_RESULT" = success
