# SCPN-MIF-CORE — automated dependency update policy.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    # Keep broad runtime compatibility floors stable. Dependabot may propose an
    # exact validation-pin bump, but the generated uv locks are refreshed on
    # main; contract tests fail closed until every exact pin matches its lock.
    versioning-strategy: increase-if-necessary
    labels: ["dependencies", "python"]
    reviewers:
      - "anulum/maintainers"
    ignore:
      - dependency-name: "sc-neurocore-engine"
      - dependency-name: "scpn-phase-orchestrator"
      - dependency-name: "scpn-control"
      - dependency-name: "scpn-fusion-core"
      - dependency-name: "scpn-quantum-control"
      # The dedicated full-chain lane pins JAX/JAXLIB as one validated pair.
      # Do not let a lock-only refresh split that pair across CI surfaces.
      - dependency-name: "jax"
      - dependency-name: "jaxlib"
      # Dependabot cannot rewrite these broad development ranges into the
      # generated uv hash lock and otherwise reports `No files have changed`.
      # They advance through the deterministic lock-refresh procedure.
      - dependency-name: "hypothesis"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "pytest-benchmark"
      - dependency-name: "pytest-xdist"
      - dependency-name: "pre-commit"
      - dependency-name: "build"
      # SciPy is coupled to the NumPy/JAX full-chain validation matrix.
      - dependency-name: "scipy"
      # NumPy 2 for the full-chain scientific stack requires its own parity
      # migration; patch updates within the validated 1.x line remain enabled.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/scpn-mif-rs"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  # The MIF Studio web vertical (Module Federation remote) — without this the npm
  # transitive tree (e.g. undici) has no auto-update path.
  - package-ecosystem: npm
    directory: "/studio-web"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
    open-pull-requests-limit: 5
    labels: ["dependencies", "studio-web"]
